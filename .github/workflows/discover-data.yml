name: Discover Data Sources

on:
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch source pages
        run: node scripts/discover.mjs

      - name: Push discovered HTML to a branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B data-discovery
          git add -f out/
          git commit -m "Discovered HTML $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push -f origin data-discovery
